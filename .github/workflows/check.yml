name: Pull request checks
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storage
      - run: pnpm test:layout
      - run: pnpm test:navigation
      - run: pnpm test:usability
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk
      - run: pnpm test:exports
        env:
          REQUIRE_WORD_QA: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-layout-qa
          path: .export-qa/
